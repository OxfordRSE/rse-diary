# Tests every push and PR; pushes to main also ship the Lambda code and static files.
# Infrastructure is not touched here: run `terraform apply` in infra/ by hand (see README).
#
# Repository variables to set (Settings → Secrets and variables → Actions → Variables):
#   AWS_DEPLOY_ROLE_ARN  from `terraform -chdir=infra/bootstrap output -raw deploy_role_arn`
#   APP_URL              from `terraform -chdir=infra output -raw app_url`

name: test-and-deploy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: deploy # one deploy at a time
    permissions:
      contents: read
      id-token: write # for AWS OIDC
    env:
      FUNCTION: rse-diary
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-2
      - name: Update Lambda code
        run: |
          (cd dist/lambda && zip -qr ../lambda.zip .)
          aws lambda update-function-code --function-name "$FUNCTION" --zip-file fileb://dist/lambda.zip > /dev/null
          aws lambda wait function-updated --function-name "$FUNCTION"
      - name: Upload static files
        run: |
          bucket="s3://rse-diary-assets-$(aws sts get-caller-identity --query Account --output text)-eu-west-2-an/static"
          # One pass per type so each gets the right Content-Type; --delete removes stale files of that type.
          for pair in "css:text/css; charset=utf-8" "js:text/javascript; charset=utf-8" "svg:image/svg+xml"; do
            aws s3 sync dist/static "$bucket" --delete --exclude '*' --include "*.${pair%%:*}" \
              --content-type "${pair#*:}" --cache-control max-age=300
          done
      - run: echo "Deployed to ${{ vars.APP_URL }}" >> "$GITHUB_STEP_SUMMARY"
